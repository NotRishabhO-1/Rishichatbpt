<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rishi.ai</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root {
  --bg: #0b0b10;
  --panel: #111118;
  --card: #1a1a24;
  --text: #eaeaf0;
  --muted: #a0a0b0;
  --primary: #7c5cff;
  --glow: 0 0 20px rgba(124,92,255,0.4);
}

body.light {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --card: #f1f2f7;
  --text: #111;
  --muted: #666;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 270px;
  background: var(--panel);
  padding: 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.05);
}

.logo {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--primary);
}

.new-btn {
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--primary);
  color: white;
  cursor: pointer;
  box-shadow: var(--glow);
  margin-bottom: 15px;
}

.chat-item {
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--muted);
}

.chat-item:hover {
  background: rgba(124,92,255,0.1);
  color: var(--text);
}

.active {
  background: rgba(124,92,255,0.2);
  color: var(--text);
}

/* MAIN */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.theme-btn {
  background: var(--card);
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text);
}

.messages {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
}

.message {
  max-width: 60%;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 12px;
  line-height: 1.6;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  background: linear-gradient(135deg, #7c5cff, #5a3fff);
  color: white;
  margin-left: auto;
}

.ai {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.05);
}

.input-box {
  padding: 20px;
  display: flex;
  gap: 10px;
  background: var(--panel);
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: var(--card);
  color: var(--text);
  outline: none;
}

.send-btn {
  padding: 14px 18px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  color: white;
  cursor: pointer;
  box-shadow: var(--glow);
}

@media (max-width: 768px) {
  .sidebar { display: none; }
}
</style></head>
<body><div class="sidebar">
  <div class="logo">⚡ rishi.ai</div>
  <button class="new-btn" onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div><div class="chat-container">
  <div class="header">
    <div></div>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
  </div>  <div class="messages" id="messages"></div>  <div class="input-box">
    <input id="input" placeholder="Ask anything..." />
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div><script>
let chats = JSON.parse(localStorage.getItem('chats')) || [];
let currentChat = [];
let currentIndex = null;

function saveChats() {
  localStorage.setItem('chats', JSON.stringify(chats));
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';

  chats.forEach((chat, i) => {
    const div = document.createElement('div');
    div.className = 'chat-item ' + (i === currentIndex ? 'active' : '');
    div.innerText = chat[0]?.text?.slice(0, 25) || 'New Chat';
    div.onclick = () => loadChat(i);
    list.appendChild(div);
  });
}

function renderMessages() {
  const messages = document.getElementById('messages');
  messages.innerHTML = '';

  currentChat.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'message ' + msg.role;
    div.innerText = msg.text;
    messages.appendChild(div);
  });

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  currentChat.push({ role: 'user', text });
  renderMessages();
  input.value = '';

  const aiMsg = { role: 'ai', text: 'Typing...' };
  currentChat.push(aiMsg);
  renderMessages();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    aiMsg.text = data.reply;

  } catch (err) {
    aiMsg.text = 'Error: ' + err.message;
  }

  if (currentIndex === null) {
    chats.push([...currentChat]);
    currentIndex = chats.length - 1;
  } else {
    chats[currentIndex] = [...currentChat];
  }

  saveChats();
  renderSidebar();
  renderMessages();
}

function newChat() {
  currentChat = [];
  currentIndex = null;
  renderMessages();
  renderSidebar();
}

function loadChat(i) {
  currentChat = chats[i];
  currentIndex = i;
  renderMessages();
  renderSidebar();
}

function toggleTheme() {
  document.body.classList.toggle('light');
}

renderSidebar();
</script></body>
</html>
